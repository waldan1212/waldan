<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspot Login - Cyber Wolf Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wolf-blue: #00f0ff;
            --wolf-glow: rgba(0, 240, 255, 0.4);
            --wolf-dark: #0a0d14;
            --wolf-card: #121824;
            --wolf-border: #1f293d;
            --wolf-accent: #3b82f6;
            --wolf-text: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--wolf-text);
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--wolf-dark);
            background-image:
                radial-gradient(circle at 20% 15%, rgba(0, 240, 255, 0.15), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.15), transparent 45%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: auto, auto, 30px 30px, 30px 30px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 34px 32px 30px;
            border-radius: 16px;
            background: rgba(18, 24, 36, 0.95);
            border: 2px solid var(--wolf-blue);
            box-shadow:
                0 0 25px rgba(0, 240, 255, 0.2),
                0 20px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 20px;
        }
        .terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: var(--wolf-blue); }
        .terminal-title {
            margin-left: auto;
            font-size: 11px;
            font-weight: 700;
            color: var(--wolf-blue);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        .header { text-align: center; margin-bottom: 26px; }

        .wolf-icon {
            width: 64px; height: 64px;
            margin: 0 auto 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px;
            border-radius: 50%;
            background: rgba(0, 240, 255, 0.1);
            border: 2px solid var(--wolf-blue);
            box-shadow: 0 0 15px var(--wolf-glow);
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 32px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--wolf-blue);
            margin-bottom: 10px;
        }

        .header p {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 4px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--wolf-blue);
            color: var(--wolf-blue);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            padding-left: 4px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: #070a0f;
            border: 1px solid var(--wolf-border);
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group input::placeholder { color: #475569; }
        .form-group input:focus {
            border-color: var(--wolf-blue);
            box-shadow: 0 0 12px var(--wolf-glow);
        }

        .btn {
            width: 100%;
            margin-top: 6px;
            padding: 14px;
            border: 1px solid var(--wolf-blue);
            border-radius: 8px;
            background: linear-gradient(135deg, #00f0ff 0%, #3b82f6 100%);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
            transition: all 0.3s ease;
        }
        .btn:hover { background: #fff; box-shadow: 0 0 20px var(--wolf-blue); transform: translateY(-1px); }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { background: #1e293b; border-color: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            display: none;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }
        .message.success { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid #10b981; }
        .message.error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }
        .message.info { background: rgba(0, 240, 255, 0.15); color: var(--wolf-blue); border: 1px solid var(--wolf-blue); }

        .register-link { text-align: center; margin-top: 22px; color: #94a3b8; font-size: 14px; }
        .register-link a { color: var(--wolf-blue); font-weight: 700; text-decoration: none; transition: text-shadow 0.2s; }
        .register-link a:hover { text-shadow: 0 0 8px var(--wolf-blue); }

        .loading {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(0,0,0,0.3); border-radius: 50%; border-top-color: #000;
            animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status-check {
            margin-top: 16px; padding: 16px;
            background: rgba(10, 13, 20, 0.6);
            border: 1px dashed var(--wolf-border);
            border-radius: 8px;
            display: none;
        }
        .status-check.show { display: block; }
        .status-check input {
            width: calc(100% - 64px); padding: 10px 14px;
            background: #070a0f; border: 1px solid var(--wolf-border); border-radius: 6px;
            color: #fff; margin-right: 6px; outline: none;
            font-size: 13px; font-weight: 600; font-family: 'Rajdhani', sans-serif;
        }
        .status-check input:focus { border-color: var(--wolf-blue); }
        .status-check button {
            padding: 10px 14px; background: var(--wolf-blue); color: #000;
            border: none; border-radius: 6px; cursor: pointer;
            font-weight: 900; font-size: 13px; font-family: 'Orbitron', sans-serif;
            transition: all 0.2s;
        }
        .status-check button:hover { background: #fff; box-shadow: 0 0 10px var(--wolf-blue); }

        .status-result { margin-top: 10px; padding: 10px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; display: none; }
        .status-result.approved { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid #10b981; }
        .status-result.pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid #f59e0b; }
        .status-result.rejected { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }
        .status-result.not-found { background: rgba(100, 116, 139, 0.15); color: #94a3b8; border: 1px solid #475569; }

        .toggle-status {
            background: none; border: none; color: #94a3b8; cursor: pointer;
            font-size: 13px; font-weight: 700; font-family: 'Rajdhani', sans-serif;
            text-decoration: underline; letter-spacing: 1px;
        }
        .toggle-status:hover { color: var(--wolf-blue); }
    </style>
</head>
<body>
    <div class="container">
        <div class="terminal-bar">
            <div class="terminal-dot dot-red"></div>
            <div class="terminal-dot dot-yellow"></div>
            <div class="terminal-dot dot-green"></div>
            <div class="terminal-title">WOLF_GATEWAY.SYS</div>
        </div>

        <div class="header">
            <div class="wolf-icon">🐺</div>
            <h1>CYBER WOLF</h1>
            <p>⚡ SECURE HOTSPOT ⚡</p>
        </div>

        <!-- FORM LOGIN MIKROTIK NATIVE ACTION -->
        <form id="loginForm" name="login" action="$(link-login-only)" method="post">
            <input type="hidden" name="dst" value="$(link-orig)">
            <input type="hidden" name="popup" value="true">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="" required placeholder="Masukkan username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">MASUK</span>
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="status-check" id="statusCheck">
            <p style="margin-bottom: 8px; color: #94a3b8; font-size: 12px; font-weight: 700; letter-spacing: 1px;">CEK STATUS REGISTRASI:</p>
            <div style="display: flex;">
                <input type="text" id="checkUsername" placeholder="Username">
                <button type="button" onclick="checkStatus()">Cek</button>
            </div>
            <div class="status-result" id="statusResult"></div>
        </div>

        <div class="register-link">
            Belum punya akun? <a href="register.html">Registrasi</a>
        </div>

        <div style="text-align: center; margin-top: 16px;">
            <button type="button" class="toggle-status" onclick="toggleStatusCheck()">
                Cek status registrasi akun
            </button>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://mamat-git-main-ahmad5-388c.vercel.app';

        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');
        const statusCheck = document.getElementById('statusCheck');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            const formData = {
                username: usernameVal,
                password: passwordVal
            };

            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Connecting...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`Access Granted, ${data.user.name}! Login berhasil.`, 'success');

                    setTimeout(() => {
                        showMessage('Mengalihkan ke jaringan...', 'info');
                        HTMLFormElement.prototype.submit.call(form);
                    }, 1500);
                } else {
                    showMessage(data.message, 'error');
                    submitBtn.disabled = false;
                    btnText.textContent = 'MASUK';
                }
            } catch (error) {
                console.error(error);
                showMessage('Terjadi kesalahan koneksi ke server backend.', 'error');
                submitBtn.disabled = false;
                btnText.textContent = 'MASUK';
            }
        });

        function toggleStatusCheck() {
            statusCheck.classList.toggle('show');
        }

        async function checkStatus() {
            const username = document.getElementById('checkUsername').value;
            const statusResult = document.getElementById('statusResult');

            if (!username) {
                statusResult.textContent = 'Masukkan username terlebih dahulu';
                statusResult.className = 'status-result not-found';
                statusResult.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/status/${username}`);
                const data = await response.json();

                if (data.success) {
                    statusResult.textContent = `Status: ${data.status.toUpperCase()}`;
                    statusResult.className = `status-result ${data.status}`;
                    statusResult.style.display = 'block';

                    if (data.status === 'pending') {
                        statusResult.textContent += ' - Menunggu persetujuan Admin';
                    } else if (data.status === 'approved') {
                        statusResult.textContent += ' - Akun aktif siap digunakan';
                    } else if (data.status === 'rejected') {
                        statusResult.textContent += ' - Akses ditolak';
                    }
                } else {
                    statusResult.textContent = data.message;
                    statusResult.className = 'status-result not-found';
                    statusResult.style.display = 'block';
                }
            } catch (error) {
                statusResult.textContent = 'Gagal mengecek status (Server offline)';
                statusResult.className = 'status-result not-found';
                statusResult.style.display = 'block';
            }
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }
    </script>
</body>
</html>
